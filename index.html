<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中文学习卡片 - Chinese Flashcard App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 30px;
            font-size: 2em;
        }

        .user-screen, .setup-screen, .learning-screen {
            display: none;
        }

        .user-screen.active, .setup-screen.active, .learning-screen.active {
            display: block;
        }

        .info-box {
            background: #f0f4ff;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            margin-bottom: 30px;
            color: #667eea;
        }

        .info-box h2 {
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        .info-box p {
            font-size: 1.1em;
            line-height: 1.6;
        }

        .user-input-group {
            margin-bottom: 25px;
        }

        .user-input-group label {
            display: block;
            margin-bottom: 10px;
            color: #667eea;
            font-weight: bold;
            font-size: 1.1em;
        }

        .user-input-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #667eea;
            border-radius: 10px;
            font-size: 1.1em;
            transition: all 0.3s ease;
        }

        .user-input-group input:focus {
            outline: none;
            border-color: #764ba2;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .saved-users {
            margin-bottom: 25px;
        }

        .saved-users h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .user-list {
            display: grid;
            gap: 10px;
        }

        .user-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #f0f4ff;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .user-item:hover {
            background: #e0e8ff;
            border-color: #667eea;
        }

        .user-info {
            flex: 1;
        }

        .user-name {
            font-weight: bold;
            color: #667eea;
            font-size: 1.1em;
        }

        .user-progress {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }

        .delete-user {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s ease;
        }

        .delete-user:hover {
            background: #ff5252;
        }

        .current-user-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #667eea;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
        }

        .mode-selection {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .mode-btn {
            padding: 30px 20px;
            border: 3px solid #667eea;
            border-radius: 15px;
            background: white;
            color: #667eea;
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .mode-btn:hover {
            background: #667eea;
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .mode-btn.selected {
            background: #667eea;
            color: white;
            transform: scale(1.05);
        }

        .start-btn, .action-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.3em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .start-btn:hover, .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .start-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .flashcard {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            padding: 60px 40px;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .flashcard:hover {
            transform: scale(1.02);
        }

        .flashcard-content {
            color: white;
            text-align: center;
            width: 100%;
        }

        .question {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 20px;
            word-wrap: break-word;
        }

        .answer {
            font-size: 2em;
            opacity: 0;
            max-height: 0;
            overflow: hidden;
            transition: all 0.3s ease;
            word-wrap: break-word;
        }

        .answer.show {
            opacity: 1;
            max-height: 500px;
            margin-top: 30px;
        }

        .flip-hint {
            position: absolute;
            bottom: 20px;
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.7);
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn-again {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
        }

        .btn-good {
            background: linear-gradient(135deg, #51cf66 0%, #40c057 100%);
        }

        .btn-again:hover {
            background: linear-gradient(135deg, #ff5252 0%, #dd4b42 100%);
        }

        .btn-good:hover {
            background: linear-gradient(135deg, #40c057 0%, #37b24d 100%);
        }

        .progress {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.1em;
            color: #667eea;
            font-weight: bold;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
        }

        .completion-message {
            text-align: center;
            padding: 40px;
            background: #f0f4ff;
            border-radius: 15px;
            margin-bottom: 20px;
            color: #667eea;
        }

        .completion-message h2 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .completion-message p {
            font-size: 1.3em;
            line-height: 1.8;
        }

        .reset-btn, .change-user-btn {
            width: 100%;
            padding: 12px;
            background: #666;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s ease;
        }

        .reset-btn:hover, .change-user-btn:hover {
            background: #444;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.5em;
            }

            .question {
                font-size: 2em;
            }

            .answer {
                font-size: 1.5em;
            }

            .mode-btn {
                padding: 20px 15px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎴 中文学习卡片</h1>

        <!-- User Selection Screen -->
        <div class="user-screen active" id="userScreen">
            <div class="info-box">
                <h2>欢迎！Welcome!</h2>
                <p>
                    选择或创建你的学习账号<br>
                    Select or create your learning profile
                </p>
            </div>

            <div class="user-input-group">
                <label for="usernameInput">
                    👤 输入你的名字 Enter Your Name
                </label>
                <input
                    type="text"
                    id="usernameInput"
                    placeholder="例如: 小明 / e.g., John"
                    maxlength="20"
                />
            </div>

            <button class="start-btn" onclick="selectOrCreateUser()">
                开始学习 Start Learning
            </button>

            <div class="saved-users" id="savedUsersSection" style="display: none;">
                <h3>📚 已保存的用户 Saved Users</h3>
                <div class="user-list" id="userList"></div>
            </div>
        </div>

        <!-- Setup Screen -->
        <div class="setup-screen" id="setupScreen">
            <div class="current-user-badge" id="currentUserBadge"></div>

            <div class="info-box">
                <h2>选择学习模式 Choose Mode</h2>
                <p id="resumeMessage" style="display: none; color: #51cf66; font-weight: bold; margin-bottom: 10px;">
                    ✅ 找到你的学习进度！<br>
                    Found your progress!
                </p>
                <p>
                    准备学习 <strong>464</strong> 个中文词汇<br>
                    Ready to learn <strong>464</strong> Chinese words
                </p>
            </div>

            <div class="mode-selection">
                <button class="mode-btn" id="engToChnBtn" onclick="selectMode('engToChn')">
                    🇬🇧 ➡️ 🇨🇳<br><br>
                    English to Pinyin
                </button>
                <button class="mode-btn" id="chnToEngBtn" onclick="selectMode('chnToEng')">
                    🇨🇳 ➡️ 🇬🇧<br><br>
                    Pinyin to English
                </button>
            </div>

            <button class="start-btn" id="startBtn" disabled onclick="startLearning()">
                <span id="startBtnText">开始学习 Start Learning</span>
            </button>

            <button class="change-user-btn" onclick="changeUser()">
                🔄 切换用户 Change User
            </button>
        </div>

        <!-- Learning Screen -->
        <div class="learning-screen" id="learningScreen">
            <div class="current-user-badge" id="learningUserBadge"></div>

            <div class="progress" id="progress"></div>

            <div class="flashcard" id="flashcard" onclick="flipCard()">
                <div class="flashcard-content">
                    <div class="question" id="question"></div>
                    <div class="answer" id="answer"></div>
                </div>
                <div class="flip-hint" id="flipHint">点击翻转 Click to flip</div>
            </div>

            <div class="controls">
                <button class="action-btn btn-again" onclick="markCard('again')">
                    ❌ 再来一次<br>Again
                </button>
                <button class="action-btn btn-good" onclick="markCard('good')">
                    ✅ 记住了<br>Got it!
                </button>
            </div>

            <div class="stats">
                <div class="stat-item">
                    <div class="stat-label">总词汇 Total</div>
                    <div class="stat-value" id="totalWords">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">已学习 Learned</div>
                    <div class="stat-value" id="learnedWords">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">剩余 Remaining</div>
                    <div class="stat-value" id="remainingWords">0</div>
                </div>
            </div>

            <div class="button-group">
                <button class="reset-btn" onclick="resetProgress()">
                    🔄 重置进度 Reset
                </button>
                <button class="change-user-btn" onclick="changeUser()">
                    👤 切换用户 Change
                </button>
            </div>
        </div>
    </div>

            localStorage.setItem('flashcard_users', JSON.stringify(users));
        }

        function loadUserProgress(username) {
            const users = getAllUsers();
            return users[username] || null;
        }

        function deleteUser(username) {
            const users = getAllUsers();
            delete users[username];
            localStorage.setItem('flashcard_users', JSON.stringify(users));
        }

        function saveCurrentProgress() {
            if (!currentUser) return;

            const progressData = {
                learningMode: learningMode,
                learnedWordIds: learnedWords.map(w => w.id),
                queueWordIds: learningQueue.map(w => w.id),
                totalWords: words.length
            };

            saveUserProgress(currentUser, progressData);
        }

        // ========== USER MANAGEMENT ==========

        function loadSavedUsers() {
            const users = getAllUsers();
            const userList = document.getElementById('userList');
            const savedUsersSection = document.getElementById('savedUsersSection');

            if (Object.keys(users).length === 0) {
                savedUsersSection.style.display = 'none';
                return;
            }

            savedUsersSection.style.display = 'block';
            userList.innerHTML = '';

            Object.entries(users).forEach(([username, data]) => {
                const userItem = document.createElement('div');
                userItem.className = 'user-item';

                const learned = data.learnedWordIds ? data.learnedWordIds.length : 0;
                const total = data.totalWords || 464;
                const percentage = Math.round((learned / total) * 100);

                userItem.innerHTML = `
                    <div class="user-info" onclick="selectUser('${username}')">
                        <div class="user-name">👤 ${username}</div>
                        <div class="user-progress">已学习 ${learned}/${total} (${percentage}%)</div>
                    </div>
                    <button class="delete-user" onclick="event.stopPropagation(); confirmDeleteUser('${username}')">删除</button>
                `;

                userList.appendChild(userItem);
            });
        }

        function selectOrCreateUser() {
            const usernameInput = document.getElementById('usernameInput');
            const username = usernameInput.value.trim();

            if (!username) {
                alert('请输入你的名字！\nPlease enter your name!');
                return;
            }

            selectUser(username);
        }

        function selectUser(username) {
            currentUser = username;
            const progress = loadUserProgress(username);

            // Update user badges
            document.getElementById('currentUserBadge').textContent = `👤 ${username}`;
            document.getElementById('learningUserBadge').textContent = `👤 ${username}`;

            // Switch to setup screen
            document.getElementById('userScreen').classList.remove('active');
            document.getElementById('setupScreen').classList.add('active');

            // Load progress if exists
            if (progress && progress.learnedWordIds && progress.learnedWordIds.length > 0) {
                document.getElementById('resumeMessage').style.display = 'block';
                document.getElementById('startBtnText').innerHTML = '继续学习 Continue Learning';

                // Pre-select mode if saved
                if (progress.learningMode) {
                    selectMode(progress.learningMode);
                }
            } else {
                document.getElementById('resumeMessage').style.display = 'none';
                document.getElementById('startBtnText').innerHTML = '开始学习 Start Learning';
            }
        }

        function confirmDeleteUser(username) {
            if (confirm(`确定要删除用户 "${username}" 吗？所有学习进度将被清除。\nAre you sure you want to delete user "${username}"? All progress will be lost.`)) {
                deleteUser(username);
                loadSavedUsers();

                if (currentUser === username) {
                    changeUser();
                }
            }
        }

        function changeUser() {
            // Save current progress before switching
            saveCurrentProgress();

            // Reset state
            currentUser = null;
            learningMode = null;
            learningQueue = [];
            learnedWords = [];
            currentCard = null;
            isFlipped = false;

            // Return to user screen
            document.getElementById('userScreen').classList.add('active');
            document.getElementById('setupScreen').classList.remove('active');
            document.getElementById('learningScreen').classList.remove('active');

            // Clear input
            document.getElementById('usernameInput').value = '';

            // Reload user list
            loadSavedUsers();

            // Reset mode selection
            document.getElementById('engToChnBtn').classList.remove('selected');
            document.getElementById('chnToEngBtn').classList.remove('selected');
            document.getElementById('startBtn').disabled = true;
        }

        // ========== LEARNING FUNCTIONS ==========

        function selectMode(mode) {
            learningMode = mode;
            document.getElementById('engToChnBtn').classList.remove('selected');
            document.getElementById('chnToEngBtn').classList.remove('selected');
            document.getElementById(mode === 'engToChn' ? 'engToChnBtn' : 'chnToEngBtn').classList.add('selected');
            document.getElementById('startBtn').disabled = false;
        }

        function startLearning() {
            const progress = loadUserProgress(currentUser);

            if (progress && progress.learnedWordIds && progress.learnedWordIds.length > 0) {
                // Resume from saved progress
                const learnedIds = new Set(progress.learnedWordIds);
                const queueIds = new Set(progress.queueWordIds || []);

                learnedWords = words.filter(w => learnedIds.has(w.id));

                if (queueIds.size > 0) {
                    learningQueue = words.filter(w => queueIds.has(w.id));
                } else {
                    learningQueue = words.filter(w => !learnedIds.has(w.id));
                    shuffleArray(learningQueue);
                }
            } else {
                // Start fresh
                learningQueue = [...words];
                learnedWords = [];
                shuffleArray(learningQueue);
            }

            // Switch to learning screen
            document.getElementById('setupScreen').classList.remove('active');
            document.getElementById('learningScreen').classList.add('active');

            updateStats();
            nextCard();
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function nextCard() {
            if (learningQueue.length === 0) {
                showCompletionMessage();
                return;
            }

            currentCard = learningQueue[0];
            isFlipped = false;

            const questionEl = document.getElementById('question');
            const answerEl = document.getElementById('answer');

            if (learningMode === 'engToChn') {
                questionEl.textContent = currentCard.english;
                answerEl.textContent = currentCard.pinyin;
            } else {
                questionEl.textContent = currentCard.pinyin;
                answerEl.textContent = currentCard.english;
            }

            answerEl.classList.remove('show');
            document.getElementById('flipHint').style.display = 'block';

            updateProgress();
        }

        function flipCard() {
            if (isFlipped) return;
            isFlipped = true;
            document.getElementById('answer').classList.add('show');
            document.getElementById('flipHint').style.display = 'none';
        }

        function markCard(result) {
            if (!isFlipped) {
                flipCard();
                return;
            }

            const card = learningQueue.shift();

            if (result === 'again') {
                card.repeatCount = (card.repeatCount || 0) + 1;
                const insertPosition = Math.min(3, learningQueue.length);
                learningQueue.splice(insertPosition, 0, card);
            } else {
                learnedWords.push(card);
            }

            // Auto-save progress
            saveCurrentProgress();

            updateStats();
            nextCard();
        }

        function updateProgress() {
            const total = words.length;
            const learned = learnedWords.length;
            const current = learned + 1;

            document.getElementById('progress').textContent =
                `第 ${current} / ${total} 个词汇 | Card ${current} of ${total}`;
        }

        function updateStats() {
            document.getElementById('totalWords').textContent = words.length;
            document.getElementById('learnedWords').textContent = learnedWords.length;
            document.getElementById('remainingWords').textContent = learningQueue.length;
        }

        function showCompletionMessage() {
            const flashcard = document.getElementById('flashcard');
            flashcard.innerHTML = `
                <div class="completion-message">
                    <h2>🎉 恭喜！</h2>
                    <h2>Congratulations!</h2>
                    <p>你已经完成了所有单词的学习！<br>
                    You've completed all the words!</p>
                    <p style="margin-top: 20px;">
                        总共学习: <strong>${words.length}</strong> 个词汇<br>
                        Total learned: <strong>${words.length}</strong> words
                    </p>
                </div>
            `;
            flashcard.onclick = null;

            // Save completion
            saveCurrentProgress();
        }

        function resetProgress() {
            if (confirm('确定要重置你的学习进度吗？所有已学词汇将被清除。\nAre you sure you want to reset your progress? All learned words will be cleared.')) {
                // Clear progress for current user
                saveUserProgress(currentUser, {
                    learningMode: null,
                    learnedWordIds: [],
                    queueWordIds: [],
                    totalWords: words.length
                });

                // Restart
                learningQueue = [];
                learnedWords = [];
                currentCard = null;
                isFlipped = false;
                learningMode = null;

                document.getElementById('setupScreen').classList.add('active');
                document.getElementById('learningScreen').classList.remove('active');
                document.getElementById('engToChnBtn').classList.remove('selected');
                document.getElementById('chnToEngBtn').classList.remove('selected');
                document.getElementById('startBtn').disabled = true;
                document.getElementById('resumeMessage').style.display = 'none';

                // Restore flashcard structure
                const flashcard = document.getElementById('flashcard');
                flashcard.innerHTML = `
                    <div class="flashcard-content">
                        <div class="question" id="question"></div>
                        <div class="answer" id="answer"></div>
                    </div>
                    <div class="flip-hint" id="flipHint">点击翻转 Click to flip</div>
                `;
                flashcard.onclick = flipCard;
            }
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (document.getElementById('learningScreen').classList.contains('active')) {
                if (e.code === 'Space') {
                    e.preventDefault();
                    flipCard();
                } else if (e.code === 'ArrowLeft' || e.code === 'Digit1') {
                    e.preventDefault();
                    markCard('again');
                } else if (e.code === 'ArrowRight' || e.code === 'Digit2') {
                    e.preventDefault();
                    markCard('good');
                }
            }
        });

        // Allow Enter key to start learning
        document.getElementById('usernameInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                selectOrCreateUser();
            }
        });

        // Initialize on load
        window.addEventListener('load', () => {
            loadSavedUsers();
        });

        // Auto-save on page unload
        window.addEventListener('beforeunload', () => {
            saveCurrentProgress();
        });
    </script>
</body>
</html>
