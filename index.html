<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中文学习卡片 - Chinese Flashcard App</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 30px;
            font-size: 2em;
        }

        .setup-screen, .learning-screen {
            display: none;
        }

        .setup-screen.active, .learning-screen.active {
            display: block;
        }

        .file-upload {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .file-upload:hover {
            background: #f0f4ff;
            border-color: #764ba2;
        }

        .file-upload input {
            display: none;
        }

        .file-upload-label {
            font-size: 1.2em;
            color: #667eea;
            cursor: pointer;
        }

        .mode-selection {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .mode-btn {
            padding: 20px;
            border: 2px solid #667eea;
            border-radius: 15px;
            background: white;
            color: #667eea;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .mode-btn:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
        }

        .mode-btn.selected {
            background: #667eea;
            color: white;
        }

        .start-btn, .action-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .start-btn:hover, .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .start-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .flashcard {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            padding: 60px 40px;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .flashcard:hover {
            transform: scale(1.02);
        }

        .flashcard-content {
            color: white;
            text-align: center;
        }

        .question {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .answer {
            font-size: 2em;
            opacity: 0;
            max-height: 0;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .answer.show {
            opacity: 1;
            max-height: 500px;
            margin-top: 20px;
        }

        .flip-hint {
            position: absolute;
            bottom: 20px;
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.7);
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn-again {
            background: #ff6b6b;
        }

        .btn-good {
            background: #51cf66;
        }

        .btn-again:hover {
            background: #ff5252;
        }

        .btn-good:hover {
            background: #40c057;
        }

        .progress {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.1em;
            color: #667eea;
            font-weight: bold;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
        }

        .message {
            text-align: center;
            padding: 20px;
            background: #f0f4ff;
            border-radius: 10px;
            margin-bottom: 20px;
            color: #667eea;
        }

        .reset-btn {
            width: 100%;
            padding: 12px;
            background: #666;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            cursor: pointer;
            margin-top: 15px;
        }

        .reset-btn:hover {
            background: #444;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .question {
                font-size: 2em;
            }

            .answer {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎴 中文学习卡片</h1>

        <!-- Setup Screen -->
        <div class="setup-screen active" id="setupScreen">
            <div class="file-upload" onclick="document.getElementById('fileInput').click()">
                <input type="file" id="fileInput" accept=".xlsx,.xls" />
                <div class="file-upload-label">
                    📁 点击上传 Chinese.xlsx 文件<br>
                    <small style="color: #999;">或拖放文件到此处</small>
                </div>
            </div>

            <div class="mode-selection">
                <button class="mode-btn" id="engToChnBtn" onclick="selectMode('engToChn')">
                    🇬🇧 ➡️ 🇨🇳<br>
                    English to Pinyin
                </button>
                <button class="mode-btn" id="chnToEngBtn" onclick="selectMode('chnToEng')">
                    🇨🇳 ➡️ 🇬🇧<br>
                    Pinyin to English
                </button>
            </div>

            <button class="start-btn" id="startBtn" disabled onclick="startLearning()">
                开始学习 Start Learning
            </button>
        </div>

        <!-- Learning Screen -->
        <div class="learning-screen" id="learningScreen">
            <div class="progress" id="progress"></div>

            <div class="flashcard" id="flashcard" onclick="flipCard()">
                <div class="flashcard-content">
                    <div class="question" id="question"></div>
                    <div class="answer" id="answer"></div>
                </div>
                <div class="flip-hint" id="flipHint">点击翻转卡片 Click to flip</div>
            </div>

            <div class="controls">
                <button class="action-btn btn-again" onclick="markCard('again')">
                    ❌ 再来一次<br>Again
                </button>
                <button class="action-btn btn-good" onclick="markCard('good')">
                    ✅ 记住了<br>Got it!
                </button>
            </div>

            <div class="stats">
                <div class="stat-item">
                    <div class="stat-label">总词汇 Total</div>
                    <div class="stat-value" id="totalWords">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">已学习 Learned</div>
                    <div class="stat-value" id="learnedWords">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">剩余 Remaining</div>
                    <div class="stat-value" id="remainingWords">0</div>
                </div>
            </div>

            <button class="reset-btn" onclick="resetApp()">
                🔄 重新开始 Reset
            </button>
        </div>
    </div>

    <script>
        // Global variables
        let words = [];
        let learningQueue = [];
        let learnedWords = [];
        let currentCard = null;
        let isFlipped = false;
        let learningMode = null; // 'engToChn' or 'chnToEng'

        // File upload handling
        const fileInput = document.getElementById('fileInput');
        fileInput.addEventListener('change', handleFileUpload);

        // Drag and drop handling
        const fileUpload = document.querySelector('.file-upload');
        fileUpload.addEventListener('dragover', (e) => {
            e.preventDefault();
            fileUpload.style.background = '#f0f4ff';
        });

        fileUpload.addEventListener('dragleave', () => {
            fileUpload.style.background = '';
        });

        fileUpload.addEventListener('drop', (e) => {
            e.preventDefault();
            fileUpload.style.background = '';
            const file = e.dataTransfer.files[0];
            if (file) {
                fileInput.files = e.dataTransfer.files;
                handleFileUpload({ target: { files: [file] } });
            }
        });

        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const jsonData = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });

                    // Parse the data (skip header if exists)
                    words = [];
                    for (let i = 0; i < jsonData.length; i++) {
                        const row = jsonData[i];
                        if (row[0] && row[1]) {
                            // Skip if it looks like a header row
                            if (i === 0 && (
                                String(row[0]).toLowerCase().includes('pinyin') ||
                                String(row[0]).toLowerCase().includes('chinese') ||
                                String(row[1]).toLowerCase().includes('english')
                            )) {
                                continue;
                            }

                            words.push({
                                pinyin: String(row[0]).trim(),
                                english: String(row[1]).trim(),
                                repeatCount: 0,
                                lastSeen: null
                            });
                        }
                    }

                    if (words.length === 0) {
                        alert('❌ 文件中没有找到有效数据。请确保第一列是拼音，第二列是英文。\nNo valid data found in file. Please ensure column 1 is pinyin and column 2 is English.');
                        return;
                    }

                    // Update UI
                    document.querySelector('.file-upload-label').innerHTML =
                        `✅ 已加载 ${words.length} 个词汇<br><small>Loaded ${words.length} words</small>`;

                    checkReadyToStart();
                } catch (error) {
                    alert('❌ 文件读取错误：' + error.message + '\nError reading file: ' + error.message);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function selectMode(mode) {
            learningMode = mode;
            document.getElementById('engToChnBtn').classList.remove('selected');
            document.getElementById('chnToEngBtn').classList.remove('selected');
            document.getElementById(mode === 'engToChn' ? 'engToChnBtn' : 'chnToEngBtn').classList.add('selected');
            checkReadyToStart();
        }

        function checkReadyToStart() {
            const startBtn = document.getElementById('startBtn');
            if (words.length > 0 && learningMode) {
                startBtn.disabled = false;
            }
        }

        function startLearning() {
            // Initialize learning queue with all words
            learningQueue = [...words].map((word, index) => ({ ...word, id: index }));
            learnedWords = [];

            // Shuffle the queue
            shuffleArray(learningQueue);

            // Switch to learning screen
            document.getElementById('setupScreen').classList.remove('active');
            document.getElementById('learningScreen').classList.add('active');

            // Update stats
            updateStats();

            // Show first card
            nextCard();
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function nextCard() {
            if (learningQueue.length === 0) {
                showCompletionMessage();
                return;
            }

            // Get next card
            currentCard = learningQueue[0];
            isFlipped = false;

            // Display question and answer based on mode
            const questionEl = document.getElementById('question');
            const answerEl = document.getElementById('answer');

            if (learningMode === 'engToChn') {
                questionEl.textContent = currentCard.english;
                answerEl.textContent = currentCard.pinyin;
            } else {
                questionEl.textContent = currentCard.pinyin;
                answerEl.textContent = currentCard.english;
            }

            // Hide answer
            answerEl.classList.remove('show');
            document.getElementById('flipHint').style.display = 'block';

            // Update progress
            updateProgress();
        }

        function flipCard() {
            if (isFlipped) return;

            isFlipped = true;
            document.getElementById('answer').classList.add('show');
            document.getElementById('flipHint').style.display = 'none';
        }

        function markCard(result) {
            if (!isFlipped) {
                flipCard();
                return;
            }

            const card = learningQueue.shift();

            if (result === 'again') {
                // Add back to queue (with some delay)
                card.repeatCount++;
                const insertPosition = Math.min(3, learningQueue.length);
                learningQueue.splice(insertPosition, 0, card);
            } else {
                // Mark as learned
                learnedWords.push(card);
            }

            updateStats();
            nextCard();
        }

        function updateProgress() {
            const total = words.length;
            const learned = learnedWords.length;
            const current = learned + 1;

            document.getElementById('progress').textContent =
                `第 ${current} / ${total} 个词汇 | Card ${current} of ${total}`;
        }

        function updateStats() {
            document.getElementById('totalWords').textContent = words.length;
            document.getElementById('learnedWords').textContent = learnedWords.length;
            document.getElementById('remainingWords').textContent = learningQueue.length;
        }

        function showCompletionMessage() {
            const flashcard = document.getElementById('flashcard');
            flashcard.innerHTML = `
                <div class="message">
                    <h2 style="margin-bottom: 15px;">🎉 恭喜！Congratulations!</h2>
                    <p style="font-size: 1.2em;">你已经完成了所有单词的学习！<br>
                    You've completed all the words!</p>
                    <p style="margin-top: 15px; font-size: 1em;">
                        总共学习: ${words.length} 个词汇<br>
                        Total learned: ${words.length} words
                    </p>
                </div>
            `;
            flashcard.onclick = null;
        }

        function resetApp() {
            if (confirm('确定要重新开始吗？所有进度将被清除。\nAre you sure you want to reset? All progress will be lost.')) {
                words = [];
                learningQueue = [];
                learnedWords = [];
                currentCard = null;
                isFlipped = false;
                learningMode = null;

                document.getElementById('setupScreen').classList.add('active');
                document.getElementById('learningScreen').classList.remove('active');
                document.getElementById('engToChnBtn').classList.remove('selected');
                document.getElementById('chnToEngBtn').classList.remove('selected');
                document.getElementById('startBtn').disabled = true;
                document.querySelector('.file-upload-label').innerHTML =
                    '📁 点击上传 Chinese.xlsx 文件<br><small style="color: #999;">或拖放文件到此处</small>';
                fileInput.value = '';
            }
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (document.getElementById('learningScreen').classList.contains('active')) {
                if (e.code === 'Space') {
                    e.preventDefault();
                    flipCard();
                } else if (e.code === 'ArrowLeft' || e.code === 'Digit1') {
                    e.preventDefault();
                    markCard('again');
                } else if (e.code === 'ArrowRight' || e.code === 'Digit2') {
                    e.preventDefault();
                    markCard('good');
                }
            }
        });
    </script>
</body>
</html>
