

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Pinyin Cards">
    <title>Pinyin Flashcards</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .mode-selection {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .mode-btn {
            padding: 20px;
            border: 2px solid #667eea;
            border-radius: 12px;
            background: white;
            color: #667eea;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .mode-btn:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .card-container {
            display: none;
        }

        .card-container.active {
            display: block;
        }

        .card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            margin-bottom: 20px;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .card-question {
            font-size: 36px;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 10px;
        }

        .card-answer {
            font-size: 24px;
            color: #4a5568;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid rgba(0,0,0,0.1);
        }

        .stats {
            background: #f7fafc;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #4a5568;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .stats-row:last-child {
            margin-bottom: 0;
            font-weight: 600;
            color: #667eea;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #48bb78;
            color: white;
        }

        .btn-secondary:hover {
            background: #38a169;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(72, 187, 120, 0.3);
        }

        .btn-danger {
            background: #f56565;
            color: white;
        }

        .btn-danger:hover {
            background: #e53e3e;
        }

        .hidden {
            display: none;
        }

        .mode-indicator {
            background: #667eea;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🇨🇳 Pinyin Flashcards</h1>
        <p class="subtitle">Practice your Chinese vocabulary</p>

        <!-- Mode Selection Screen -->
        <div id="modeSelection" class="mode-selection">
            <button class="mode-btn" onclick="startPractice('pinyinToEnglish')">
                📖 Pinyin → English
            </button>
            <button class="mode-btn" onclick="startPractice('englishToPinyin')">
                📝 English → Pinyin
            </button>
        </div>

        <!-- Flashcard Screen -->
        <div id="cardContainer" class="card-container">
            <div class="mode-indicator" id="modeIndicator"></div>
            
            <div class="stats" id="stats">
                <div class="stats-row">
                    <span>Cards seen:</span>
                    <span id="cardsSeen">0</span>
                </div>
                <div class="stats-row">
                    <span>Translations revealed:</span>
                    <span id="cardsRevealed">0</span>
                </div>
                <div class="stats-row">
                    <span>Remember rate:</span>
                    <span id="rememberRate">0%</span>
                </div>
            </div>

            <div class="card">
                <div class="card-question" id="question"></div>
                <div class="card-answer hidden" id="answer"></div>
            </div>

            <div class="button-group">
                <button class="btn btn-primary" id="revealBtn" onclick="revealAnswer()">
                    💡 Show Translation
                </button>
                <button class="btn btn-secondary" onclick="nextCard()">
                    ➡️ Next Card
                </button>
                <button class="btn btn-danger" onclick="stopPractice()">
                    🛑 Stop Practice
                </button>
            </div>
        </div>
    </div>

    <script>
        // Flashcard data
        const flashcards = [
            { pinyin: "nǐ hǎo", english: "hello" },
            { pinyin: "xièxiè", english: "thank you" },
            { pinyin: "zàijiàn", english: "goodbye" },
            { pinyin: "duìbuqǐ", english: "sorry" },
            { pinyin: "qǐng", english: "please" },
            { pinyin: "shì", english: "yes" },
            { pinyin: "bú shì", english: "no" },
            { pinyin: "hǎo", english: "good" },
            { pinyin: "bù hǎo", english: "not good" },
            { pinyin: "wǒ", english: "I/me" },
            { pinyin: "nǐ", english: "you" },
            { pinyin: "tā", english: "he/she/it" },
            { pinyin: "wǒmen", english: "we/us" },
            { pinyin: "nǐmen", english: "you (plural)" },
            { pinyin: "tāmen", english: "they/them" },
            { pinyin: "shuǐ", english: "water" },
            { pinyin: "chá", english: "tea" },
            { pinyin: "fàn", english: "rice/meal" },
            { pinyin: "miànbāo", english: "bread" },
            { pinyin: "píngguǒ", english: "apple" },
            { pinyin: "júzi", english: "orange" },
            { pinyin: "yī", english: "one" },
            { pinyin: "èr", english: "two" },
            { pinyin: "sān", english: "three" },
            { pinyin: "sì", english: "four" },
            { pinyin: "wǔ", english: "five" },
            { pinyin: "liù", english: "six" },
            { pinyin: "qī", english: "seven" },
            { pinyin: "bā", english: "eight" },
            { pinyin: "jiǔ", english: "nine" },
            { pinyin: "shí", english: "ten" },
            { pinyin: "tiān", english: "day/sky" },
            { pinyin: "rén", english: "person" },
            { pinyin: "jiā", english: "home/family" },
            { pinyin: "xuéxiào", english: "school" },
            { pinyin: "lǎoshī", english: "teacher" },
            { pinyin: "xuésheng", english: "student" },
            { pinyin: "shū", english: "book" },
            { pinyin: "bǐ", english: "pen" },
            { pinyin: "zhuōzi", english: "table" },
            { pinyin: "yǐzi", english: "chair" },
            { pinyin: "mén", english: "door" },
            { pinyin: "chuāng", english: "window" },
            { pinyin: "chē", english: "car" },
            { pinyin: "fēijī", english: "airplane" },
            { pinyin: "huǒchē", english: "train" },
            { pinyin: "diànhuà", english: "telephone" },
            { pinyin: "diànnǎo", english: "computer" },
            { pinyin: "shǒujī", english: "cellphone" },
            { pinyin: "péngyou", english: "friend" },
            { pinyin: "àihào", english: "hobby" },
            { pinyin: "yīnyuè", english: "music" },
            { pinyin: "diànyǐng", english: "movie" },
            { pinyin: "yùndòng", english: "sports" },
            { pinyin: "zúqiú", english: "soccer/football" }
        ];

        let currentMode = '';
        let currentCard = null;
        let stats = {
            seen: 0,
            revealed: 0
        };

        function startPractice(mode) {
            currentMode = mode;
            stats = { seen: 0, revealed: 0 };
            
            document.getElementById('modeSelection').style.display = 'none';
            document.getElementById('cardContainer').classList.add('active');
            
            const modeText = mode === 'pinyinToEnglish' ? '📖 Pinyin → English' : '📝 English → Pinyin';
            document.getElementById('modeIndicator').textContent = modeText;
            
            showNextCard();
        }

        function showNextCard() {
            currentCard = flashcards[Math.floor(Math.random() * flashcards.length)];
            
            const questionEl = document.getElementById('question');
            const answerEl = document.getElementById('answer');
            const revealBtn = document.getElementById('revealBtn');
            
            if (currentMode === 'pinyinToEnglish') {
                questionEl.textContent = currentCard.pinyin;
                answerEl.textContent = `✅ ${currentCard.english}`;
            } else {
                questionEl.textContent = currentCard.english;
                answerEl.textContent = `✅ ${currentCard.pinyin}`;
            }
            
            answerEl.classList.add('hidden');
            revealBtn.classList.remove('hidden');
            revealBtn.disabled = false;
        }

        function revealAnswer() {
            stats.revealed++;
            stats.seen++;
            
            document.getElementById('answer').classList.remove('hidden');
            document.getElementById('revealBtn').classList.add('hidden');
            
            updateStats();
        }

        function nextCard() {
            stats.seen++;
            updateStats();
            showNextCard();
        }

        function updateStats() {
            document.getElementById('cardsSeen').textContent = stats.seen;
            document.getElementById('cardsRevealed').textContent = stats.revealed;
            
            const rememberRate = stats.seen > 0 
                ? ((stats.seen - stats.revealed) / stats.seen * 100).toFixed(1)
                : 0;
            document.getElementById('rememberRate').textContent = `${rememberRate}%`;
        }

        function stopPractice() {
            const rememberRate = stats.seen > 0 
                ? ((stats.seen - stats.revealed) / stats.seen * 100).toFixed(1)
                : 0;
            
            const message = `Practice Ended! 🎉\n\nCards seen: ${stats.seen}\nTranslations revealed: ${stats.revealed}\nCards remembered: ${stats.seen - stats.revealed}\nRemember rate: ${rememberRate}%\n\nGreat work! 加油!`;
            
            alert(message);
            
            document.getElementById('cardContainer').classList.remove('active');
            document.getElementById('modeSelection').style.display = 'flex';
        }
    </script>
</body>
</html>
